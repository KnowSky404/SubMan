name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "deploy" to confirm a production deployment from main
        required: true
        type: string
      commit:
        description: Full SHA of the verified main commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      ci: ${{ steps.evidence.outputs.ci }}
    steps:
      - name: Validate deployment request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          COMMIT: ${{ inputs.commit }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$CONFIRMATION" != "deploy" || "$COMMIT" != "$GITHUB_SHA" ]]; then
            echo "::error::Dispatch from main with confirmation 'deploy' and the full verified commit SHA."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require successful integrated CI
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ci=$(bash scripts/production-ci.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA"); then
            echo "::error::The latest main push CI for this exact SHA must have completed successfully."
            exit 1
          fi
          echo "ci=$ci" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing production environment secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing production environment secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Verify main is still the requested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main" != "$GITHUB_SHA" ]]; then
            echo "::error::Main has advanced. Verify the new integrated candidate before requesting deployment."
            exit 1
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy --strict --message "GitHub Actions ${GITHUB_SHA}"

      - name: Record deployment summary
        env:
          CI_RUN: ${{ needs.gate.outputs.ci }}
        run: |
          {
            echo "### SubMan production deployment"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- CI evidence: ${CI_RUN}"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Environment: \`production\`"
            echo "- Worker version: see Current Version ID in the Deploy Worker log"
            echo "- Production verification: record readiness and affected behavior after deployment"
          } >> "$GITHUB_STEP_SUMMARY"
