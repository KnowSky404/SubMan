name: Refresh Wrangler runtime

on:
  push:
    branches:
      - ci/harden-cloudflare-pipeline-20260828

permissions:
  contents: write

concurrency:
  group: refresh-wrangler-runtime
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ci/harden-cloudflare-pipeline-20260828
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Upgrade and pin Wrangler
        run: bun add --dev --exact wrangler@4.127.0

      - name: Refresh generated Worker types
        run: bun run generate:worker-types

      - name: Format generated sources
        run: bunx biome check --write package.json src/worker-configuration.d.ts

      - name: Verify the upgraded runtime
        run: |
          bunx wrangler --version
          bun run check:worker-types

      - name: Remove one-shot workflow
        run: rm .github/workflows/refresh-wrangler-runtime.yml

      - name: Commit runtime upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "build(deps): upgrade Wrangler runtime"
          git push origin HEAD:ci/harden-cloudflare-pipeline-20260828
