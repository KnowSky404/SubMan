name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      suite: ${{ steps.scope.outputs.suite }}
    steps:
      - name: Check out PR integration
        if: github.event_name == 'pull_request'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select verification suites
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          suite=full
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Load the policy from the base so the PR cannot exempt its own changes.
            if git show "$BASE_SHA:scripts/ci-scope.sh" > "$RUNNER_TEMP/ci-scope.sh" &&
              result=$(bash "$RUNNER_TEMP/ci-scope.sh" "$BASE_SHA" "$GITHUB_SHA" "$HEAD_SHA"); then
              case "$result" in
                docs|ui|full) suite=$result ;;
              esac
            fi
          fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          printf 'Suite: %s\nIntegration: %s\nPR head: %s\nPR base: %s\n' \
            "$suite" "$GITHUB_SHA" "${HEAD_SHA:-n/a}" "${BASE_SHA:-n/a}" >> "$GITHUB_STEP_SUMMARY"

  fast:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun run docs:check

      - if: needs.scope.outputs.suite != 'docs'
        run: |
          bun install --frozen-lockfile
          bun test
          bun run check
          bun run lint

      - if: needs.scope.outputs.suite == 'full'
        run: |
          bash scripts/test-workflow.sh
          bun run test:sing-box

  runtime:
    needs: scope
    if: needs.scope.outputs.suite != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run build

      - if: needs.scope.outputs.suite == 'full'
        run: bun run test:cf:built

      - run: bun run deploy:check:built
      - run: bunx playwright install --with-deps chromium

      - run: bun run test:e2e
        env:
          SUBMAN_E2E_USE_BUILD: '1'

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    if: always()
    needs: [scope, fast, runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the selected checks
        env:
          SCOPE: ${{ needs.scope.result }}
          SUITE: ${{ needs.scope.outputs.suite }}
          FAST: ${{ needs.fast.result }}
          RUNTIME: ${{ needs.runtime.result }}
        run: |
          if [[ "$SCOPE" == success && "$FAST" == success ]]; then
            case "$SUITE:$RUNTIME" in
              docs:skipped|ui:success|full:success) exit 0 ;;
            esac
          fi
          echo "::error::Incomplete CI: scope=$SCOPE suite=$SUITE fast=$FAST runtime=$RUNTIME"
          exit 1
