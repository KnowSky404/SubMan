name: Apply Hysteria2 formatting

on:
  push:
    branches:
      - fix/hysteria2-uri-fidelity-20260828

permissions:
  contents: write

concurrency:
  group: hysteria2-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply Biome formatting
        run: |
          bunx biome check --write \
            src/lib/client-export/hysteria2-fidelity.test.ts \
            src/lib/client-export/hysteria2.ts \
            src/lib/client-export/uri.ts \
            src/lib/hysteria2-uri.test.ts \
            src/lib/hysteria2-uri.ts \
            src/lib/proxy-protocol.ts

      - name: Commit formatting changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/client-export/hysteria2-fidelity.test.ts \
            src/lib/client-export/hysteria2.ts \
            src/lib/client-export/uri.ts \
            src/lib/hysteria2-uri.test.ts \
            src/lib/hysteria2-uri.ts \
            src/lib/proxy-protocol.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(export): apply Biome formatting"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
